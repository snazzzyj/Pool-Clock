<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="clock">
      <!--Hour positions with pockets-->
      <div class="number-position" style="--rotation: 0deg">
        <div class="pocket" id="pocket-12"></div>
      </div>

      <div class="number-position" style="--rotation: 30deg">
        <div class="pocket" id="pocket-1"></div>
      </div>

      <div class="number-position" style="--rotation: 60deg">
        <div class="pocket" id="pocket-2"></div>
      </div>

      <div class="number-position" style="--rotation: 90deg">
        <div class="pocket" id="pocket-3"></div>
      </div>

      <div class="number-position" style="--rotation: 120deg">
        <div class="pocket" id="pocket-4"></div>
      </div>


      <div class="number-position" style="--rotation: 150deg">
        <div class="pocket" id="pocket-5"></div>
      </div>

      <div class="number-position" style="--rotation: 180deg">
        <div class="pocket" id="pocket-6"></div>
      </div>

      <div class="number-position" style="--rotation: 210deg">
        <div class="pocket" id="pocket-7"></div>
      </div>

      <div class="number-position" style="--rotation: 240deg">
        <div class="pocket" id="pocket-8"></div>
      </div>


      <div class="number-position" style="--rotation: 270deg">
        <div class="pocket" id="pocket-9"></div>
      </div>


      <div class="number-position" style="--rotation: 300deg">
        <div class="pocket" id="pocket-10"></div>
      </div>


      <div class="number-position" style="--rotation: 330deg">
        <div class="pocket" id="pocket-11"></div>
      </div>

<!--clock hands-->
      <div class="hand hour-hand" id="hour-hand"></div>
      <div class="hand minute-hand" id="minute-hand"></div>
      <div class="hand second-hand" id="second-hand"></div>
      <div class="center-dot"></div>
    
</div>
    </div>

        <script src="script.js"></script>
  </body>
</html>
